<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ancora-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="80%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="ancora-brand-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Top Infinity Teardrop Loop -->
  <path d="M50 10 C38 10, 34 26, 50 36 C66 26, 62 10, 50 10 Z" stroke="url(#ancora-brand-grad)" stroke-width="6.5" fill="none" filter="url(#ancora-brand-glow)" />
  <circle cx="50" cy="21" r="4.5" fill="url(#ancora-brand-grad)" />

  <!-- Vertical Stem -->
  <path d="M50 35 V72" stroke="url(#ancora-brand-grad)" stroke-width="7" stroke-linecap="round" filter="url(#ancora-brand-glow)" />

  <!-- Horizontal Crossbar -->
  <path d="M30 48 H70" stroke="url(#ancora-brand-grad)" stroke-width="6" stroke-linecap="round" filter="url(#ancora-brand-glow)" />

  <!-- Sweeping Anchor Flukes (U-Arc) -->
  <path d="M18 54 C18 81, 50 89, 50 89 C50 89, 82 81, 82 54" stroke="url(#ancora-brand-grad)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#ancora-brand-glow)" />
  
  <!-- Left Upward Arrow Barb -->
  <path d="M12 63 L18 52 L24 63" stroke="url(#ancora-brand-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#ancora-brand-glow)" />
  
  <!-- Right Upward Arrow Barb -->
  <path d="M76 63 L82 52 L88 63" stroke="url(#ancora-brand-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#ancora-brand-glow)" />
</svg>